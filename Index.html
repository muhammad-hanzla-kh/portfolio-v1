}

[data-theme="light"] .text-gradient{
  background:linear-gradient(92deg,#0a1230 0%,#0891b2 45%,#d97706 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

.btn-primary{
  background:linear-gradient(90deg,#06b6d4,#22d3ee);
  color:#02131a;
  box-shadow:0 12px 30px rgba(34,211,238,.35)
}

.btn-amber{
  background:#fbbf24;
  color:#1a1200;
  box-shadow:0 10px 28px rgba(251,191,36,.28)
}

.chip{
  border:1px solid var(--line);
  background:var(--surface)
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-12px)
  }
}

@keyframes pulseGlow{
  0%,100%{
    opacity:.55;
    transform:scale(1)
  }

  50%{
    opacity:.95;
    transform:scale(1.08)
  }
}

@keyframes marquee{
  from{
    transform:translateX(0)
  }

  to{
    transform:translateX(-50%)
  }
}

@keyframes shimmer{
  from{
    background-position:0% 0
  }

  to{
    background-position:200% 0
  }
}

.floaty{
  animation:floaty 5s ease-in-out infinite
}

.glow{
  animation:pulseGlow 4s ease-in-out infinite
}

.marquee{
  animation:marquee 28s linear infinite
}

.tilt{
  transition:transform .18s ease, box-shadow .25s ease;
  transform-style:preserve-3d;
  will-change:transform
}

.tilt:hover{
  box-shadow:0 24px 50px rgba(0,0,0,.35)
}

/* ---- Animated Tech Stack + Projects ---- */

@keyframes chipPop{
  0%{
    opacity:0;
    transform:translateY(14px) scale(.72)
  }

  60%{
    opacity:1;
    transform:translateY(-3px) scale(1.08)
  }

  100%{
    opacity:1;
    transform:translateY(0) scale(1)
  }
}

@keyframes cardRise{
  from{
    opacity:0;
    transform:translateY(34px) scale(.97)
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1)
  }
}

@keyframes borderFlow{
  0%{
    background-position:0% 50%
  }

  50%{
    background-position:100% 50%
  }

  100%{
    background-position:0% 50%
  }
}

@keyframes orbFloat{
  0%,100%{
    transform:translate(0,0) scale(1)
  }

  33%{
    transform:translate(18px,-22px) scale(1.12)
  }

  66%{
    transform:translate(-14px,12px) scale(.94)
  }
}

@keyframes shimmerSlide{
  0%{
    background-position:-200% 0
  }

  100%{
    background-position:200% 0
  }
}

@keyframes slideLeft{
  from{
    opacity:0;
    transform:translateX(-52px);
    filter:blur(8px)
  }

  to{
    opacity:1;
    transform:translateX(0);
    filter:blur(0)
  }
}

@keyframes slideRight{
  from{
    opacity:0;
    transform:translateX(52px);
    filter:blur(8px)
  }

  to{
    opacity:1;
    transform:translateX(0);
    filter:blur(0)
  }
}

@keyframes spotlightIn{
  from{
    opacity:0;
    transform:translateY(14px) scale(.985)
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1)
  }
}

@keyframes spotlightBar{
  from{
    width:0%
  }

  to{
    width:100%
  }
}

@keyframes pulseBtn{
  0%,100%{
    box-shadow:0 0 0 0 rgba(34,211,238,.55);
    transform:scale(1)
  }

  50%{
    box-shadow:0 0 0 10px rgba(34,211,238,0);
    transform:scale(1.04)
  }
}

@keyframes underlineGrow{
  from{
    transform:scaleX(.08)
  }

  to{
    transform:scaleX(1)
  }
}

@keyframes barShine{
  0%{
    transform:translateX(-100%)
  }

  100%{
    transform:translateX(250%)
  }
}

@keyframes drift{
  0%,100%{
    transform:translate(0,0) rotate(0deg)
  }

  50%{
    transform:translate(16px,-18px) rotate(10deg)
  }
}

.marquee-wrap:hover .marquee{
  animation-play-state:paused
}

.marquee-item{
  text-shadow:0 0 22px rgba(34,211,238,.55)
}

.skill-chip{
  animation:chipPop .55s cubic-bezier(.34,1.56,.64,1) both;
  transition:transform .22s ease,box-shadow .22s ease,background .22s ease,color .22s ease,border-color .22s ease;
  will-change:transform
}

.skill-chip:hover{
  transform:translateY(-4px) scale(1.08);
  background:linear-gradient(90deg,rgba(34,211,238,.22),rgba(251,191,36,.22));
  border-color:rgba(34,211,238,.75);
  box-shadow:0 10px 24px rgba(34,211,238,.28);
  color:var(--text)
}

.skill-card{
  animation:cardRise .65s cubic-bezier(.22,1,.36,1) both;
  transition:transform .25s ease,box-shadow .25s ease
}

.gradient-border{
  background:linear-gradient(110deg,#22d3ee,#818cf8,#fbbf24,#22d3ee);
  background-size:300% 300%;
  animation:borderFlow 5s linear infinite;
  padding:1.5px;
  border-radius:22px
}

.gradient-border>div{
  border-radius:20.5px;
  background:var(--card)
}

[data-theme="light"] .gradient-border>div{
  background:#fff
}

.orb{
  animation:orbFloat 9s ease-in-out infinite;
  will-change:transform
}

.orb-slow{
  animation:orbFloat 13s ease-in-out infinite reverse
}

.tech-badge{
  position:relative;
  overflow:hidden;
  transition:transform .22s ease,box-shadow .22s ease
}

.tech-badge:hover{
  transform:translateY(-2px) scale(1.06);
  box-shadow:0 8px 20px rgba(251,191,36,.25)
}

.tech-badge::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);
  background-size:200% 100%;
  transform:translateX(-100%)
}

.tech-badge:hover::after{
  animation:shimmerSlide .8s ease
}

.project-card{
  transition:transform .35s ease,box-shadow .35s ease,opacity .35s ease,border-color .35s ease;
  will-change:transform
}

.project-card:hover{
  transform:translateY(-8px);
  border-color:rgba(34,211,238,.6);
  box-shadow:0 28px 60px rgba(0,0,0,.38),0 0 0 1px rgba(34,211,238,.25),0 0 42px rgba(34,211,238,.18)
}

.project-card:hover .project-zoom{
  transform:scale(1.06)
}

.project-zoom{
  transition:transform .55s ease
}

.project-from-left{
  animation:slideLeft .75s cubic-bezier(.22,1,.36,1) both
}

.project-from-right{
  animation:slideRight .75s cubic-bezier(.22,1,.36,1) both
}

.spotlight-in{
  animation:spotlightIn .55s ease both
}

.spotlight-progress{
  animation:spotlightBar 5s linear both;
  transform-origin:left
}

.pulse-btn{
  animation:pulseBtn 2s ease-in-out infinite
}

.heading-underline{
  position:relative;
  display:inline-block
}

.heading-underline::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-6px;
  height:4px;
  width:100%;
  border-radius:99px;
  background:linear-gradient(90deg,#22d3ee,#fbbf24);
  transform-origin:left;
  animation:underlineGrow 1.1s ease both
}

.project-expand{
  overflow:hidden;
  transition:max-height .55s cubic-bezier(.22,1,.36,1),opacity .45s ease
}

.drift-shape{
  animation:drift 10s ease-in-out infinite
}

.reveal{
  opacity:0;
  transform:translateY(28px);
  transition:opacity .65s ease,transform .65s ease
}

.reveal.is-visible{
  opacity:1;
  transform:translateY(0)
}

.proficiency-fill{
  transition:width 1.25s cubic-bezier(.22,1,.36,1);
  position:relative;
  overflow:hidden
}

.proficiency-fill::after{
  content:"";
  position:absolute;
  inset:0;
  width:40%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:barShine 1.8s ease-in-out infinite
}

.filter-btn{
  transition:transform .22s ease,background .22s ease,box-shadow .22s ease
}

.filter-btn:hover{
  transform:translateY(-2px) scale(1.03)
}

.filter-btn.active{
  box-shadow:0 10px 26px rgba(34,211,238,.35)
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important
  }

  .reveal{
    opacity:1;
    transform:none
  }

  .skill-chip,.skill-card{
    animation:none;
    opacity:1
  }
}

::-webkit-scrollbar{
  width:9px
}

::-webkit-scrollbar-thumb{
  background:#1e3a6e;
  border-radius:99px
}

::-webkit-scrollbar-track{
  background:transparent
}

::-moz-selection{
  background:#fbbf24;
  color:#111
}

::selection{
  background:#fbbf24;
  color:#111
}

.last\:pb-0:last-child {
  padding-bottom: 0px;
}

.hover\:border-cyan-300\/30:hover {
  border-color: rgb(103 232 249 / 0.3);
}

.hover\:border-cyan-300\/50:hover {
  border-color: rgb(103 232 249 / 0.5);
}

.hover\:border-cyan-300\/60:hover {
  border-color: rgb(103 232 249 / 0.6);
}

.hover\:bg-\[var\(--surface2\)\]:hover {
  background-color: var(--surface2);
}

.hover\:bg-amber-400\/15:hover {
  background-color: rgb(251 191 36 / 0.15);
}

.hover\:bg-cyan-400\/15:hover {
  background-color: rgb(34 211 238 / 0.15);
}

.hover\:bg-white\/50:hover {
  background-color: rgb(255 255 255 / 0.5);
}

.hover\:text-\[var\(--text\)\]:hover {
  color: var(--text);
}

@media (min-width: 640px) {
  .sm\:block {
    display: block;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:p-12 {
    padding: 3rem;
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:p-7 {
    padding: 1.75rem;
  }

  .sm\:p-8 {
    padding: 2rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .sm\:text-4xl {
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .sm\:text-5xl {
    font-size: 3rem;
    line-height: 1;
  }

  .sm\:text-6xl {
    font-size: 3.75rem;
    line-height: 1;
  }

  .sm\:text-\[84px\] {
    font-size: 84px;
  }

  .sm\:text-lg {
    font-size: 1.125rem;
    line-height: 1.75rem;
  }

  .sm\:text-xl {
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 768px) {
  .md\:col-span-2 {
    grid-column: span 2 / span 2;
  }

  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .md\:grid-cols-\[1fr_auto\] {
    grid-template-columns: 1fr auto;
  }

  .md\:items-center {
    align-items: center;
  }
}

@media (min-width: 1024px) {
  .lg\:flex {
    display: flex;
  }

  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[\.85fr_1\.15fr\] {
    grid-template-columns: .85fr 1.15fr;
  }

  .lg\:grid-cols-\[1\.05fr_\.95fr\] {
    grid-template-columns: 1.05fr .95fr;
  }

  .lg\:grid-cols-\[1\.1fr_\.9fr\] {
    grid-template-columns: 1.1fr .9fr;
  }

  .lg\:grid-cols-\[1\.25fr_\.75fr\] {
    grid-template-columns: 1.25fr .75fr;

  .lg\:divide-x > :not([hidden]) ~ :not([hidden]) {
    --tw-divide-x-reverse: 0;

  }

  .lg\:pt-16 {

  }

  .lg\:text-\[98px\] {

  }
}
